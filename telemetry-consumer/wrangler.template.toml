# Copy to wrangler.toml and replace the database_id with your actual D1 UUID.
# This is a PRIVATE queue-only worker; it must not expose workers.dev or custom routes.
name = "edgeguard-reliability-consumer"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = false

[[d1_databases]]
binding = "RELIABILITY_DB"
database_name = "edgeguard-reliability"
database_id = "REPLACE_WITH_REAL_D1_DATABASE_ID"

[[queues.consumers]]
queue = "edgeguard-reliability"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "edgeguard-reliability-dlq"
