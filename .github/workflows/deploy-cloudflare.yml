name: Deploy Cloudflare Worker
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edgeguard-adaptive-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy public demo
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check required Cloudflare secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets before deploying."
            exit 1
          fi
      - name: Verify Cloudflare token before deployment
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Cloudflare user tokens and account-owned tokens have different
          # verification API endpoints. Do not print token or response body.
          case "$CF_TOKEN" in
            cfk_*)
              echo "::error::CLOUDFLARE_API_TOKEN contains a Global API Key (cfk_), not a scoped API token. Create a user API token or account API token."
              exit 1
              ;;
            cfat_*)
              endpoint="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/tokens/verify"
              ;;
            *)
              endpoint="https://api.cloudflare.com/client/v4/user/tokens/verify"
              ;;
          esac
          code="$(curl --silent --show-error --output "$RUNNER_TEMP/cf-token-status.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer $CF_TOKEN" "$endpoint")"
          if [ "$code" != "200" ] || ! jq -e '.success == true and .result.status == "active"' "$RUNNER_TEMP/cf-token-status.json" >/dev/null; then
            echo "::error::Cloudflare token verification failed (HTTP $code). Verify token is active, correctly copied, permitted for this account, and has no incompatible IP restrictions. See Cloudflare API Tokens; do not reveal credentials."
            exit 1
          fi
          echo "Cloudflare API token verified (secrets not displayed)."
      - name: Install and validate Worker
        working-directory: worker
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
      - name: Verify fail-closed public configuration
        working-directory: worker
        run: |
          grep -Eq '^ORIGIN_URLS[[:space:]]*=[[:space:]]*""[[:space:]]*$' wrangler.toml || {
            echo "::error::Public demo must have ORIGIN_URLS disabled"
            exit 1
          }
      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
      - name: Publish deployment address
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -n "$WORKER_URL" ]; then
            echo "Cloudflare Worker deployment: $WORKER_URL" >> "$GITHUB_STEP_SUMMARY"
            echo "Open $WORKER_URL/healthz to test health endpoint." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Deployment completed, but action did not expose a URL. Inspect the Wrangler deploy logs for the address." >> "$GITHUB_STEP_SUMMARY"
          fi
